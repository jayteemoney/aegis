<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Aegis">
  <title>Aegis</title>

  <!-- The mark is a shield — aegis is the shield of Zeus — split down the
       middle into the project's two halves: amber for what stays private,
       blue for what reaches the public ledger. The diamond is cut out of the
       shield rather than drawn on top, so the split reads even at 16px. -->

  <defs>
    <!-- Shield silhouette, shared by the fills and the cut-out mask. -->
    <path id="shield" d="M256 40 L436 112 v152 c0 106-74 176-180 208 C150 440 76 370 76 264 V112 Z"/>

    <clipPath id="left">  <rect x="0"   y="0" width="256" height="512"/></clipPath>
    <clipPath id="right"> <rect x="256" y="0" width="256" height="512"/></clipPath>

    <mask id="cut">
      <use href="#shield" fill="#fff"/>
      <!-- Negative-space diamond, the same ◈ used as the brand mark in the UI. -->
      <path d="M256 168 L330 262 L256 356 L182 262 Z" fill="#000"/>
      <path d="M256 214 L294 262 L256 310 L218 262 Z" fill="#fff"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="#080b10"/>

  <g mask="url(#cut)">
    <g clip-path="url(#left)">
      <use href="#shield" fill="#f0b429"/>
    </g>
    <g clip-path="url(#right)">
      <use href="#shield" fill="#4c9fff"/>
    </g>
  </g>

  <!-- A hairline seam so the two halves read as deliberate, not a rendering seam. -->
  <line x1="256" y1="40" x2="256" y2="470" stroke="#080b10" stroke-width="7"/>
</svg>
